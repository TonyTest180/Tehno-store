D={cats:(c.data||[]).map(r=>({id:r.id,name:r.name,icon:r.icon})),prods:(p.data||[]).map(r=>({id:+r.id,grp:+r.grp,cat:r.category_id,name:r.name,brand:r.brand||'',desc:r.description||'',year:r.year,country:r.country||'',warranty:r.warranty_months,sp:r.specs||{},ops:r.opt_names||[],o:r.opts||{},price:+r.price,disc:+r.discount,stock:r.in_stock,imgs:r.images||[],date:+new Date(r.created_at)})),
home:{banners:[],brands:[],...(hs.home||{})},info:hs.info||{},orders:(o.data||[]).map(r=>({id:+r.id,email:r.email,fio:r.fio,phone:r.phone,city:r.city,dv:r.delivery,addr:r.address,pay:r.payment,status:r.status,total:+r.total,items:r.items||[]}))};
norm();norm2();norm3();SN={cats:{},prods:{},home:{home:J(D.home),info:J(D.info)},ord:{},fav:[],cmp:[],cart:{}};D.cats.forEach((x,i)=>SN.cats[x.id]=J(crow(x,i)));D.prods.forEach(x=>SN.prods[x.id]=J(prow(x)));D.orders.forEach(x=>SN.ord[x.id]=x.status||'new');
if(U){const[f,m,k]=await Promise.all(['favorites','compare_items','cart_items'].map(t=>SB.from(t).select('*')));const l=S[U.email]=S[U.email]||{};l.fav=(f.data||[]).map(r=>+r.product_id);l.cmp=(m.data||[]).map(r=>+r.product_id);l.cart=(k.data||[]).map(r=>({id:+r.product_id,q:r.quantity}));SN.fav=[...l.fav];SN.cmp=[...l.cmp];SN.cart=Object.fromEntries(l.cart.map(c=>[c.id,c.q]))}}
async function boot(){SN=null;U=null;try{const s=(await SB.auth.getSession()).data.session;if(s){const pf=(await SB.from('profiles').select('is_admin').eq('id',s.user.id).maybeSingle()).data;U={id:s.user.id,email:s.user.email,admin:!!(pf&&pf.is_admin)}}await loadAll()}catch(e){console.error(e);alert('Ошибка Supabase: '+(e.message||e)+'. Проверьте SUPA_URL, SUPA_KEY и что схема создана.')}nav();route()}
async function authS(reg){const e=$('#le').value.trim(),p=$('#lp').value;if(!e||!p)return alert('Заполните поля');const r=reg?await SB.auth.signUp({email:e,password:p}):await SB.auth.signInWithPassword({email:e,password:p});if(r.error)return alert(r.error.message);close_();if(reg&&!r.data.session)return alert('Мы отправили письмо — подтвердите e-mail и войдите');await boot()}
async function logoutS(){await SB.auth.signOut();await boot()}
function auth(reg){return SB?authS(reg):authDemo(reg)}function logout(){return SB?logoutS():logoutDemo()}

/* ===== v4: произвольные параметры конфигураций ===== */
function norm3(){D.prods.forEach(p=>{if(!p.ops){p.ops=[];p.o={};if(p.mem){p.ops.push('Конфигурация');p.o['Конфигурация']=p.mem}if(p.color){p.ops.push('Цвет');p.o['Цвет']=p.color}}p.o=p.o||{};delete p.mem;delete p.color});
const g={};D.prods.forEach(p=>{const k=p.grp||p.id;g[k]=g[k]||[];p.ops.forEach(n=>{if(!g[k].includes(n))g[k].push(n)})});D.prods.forEach(p=>p.ops=[...g[p.grp||p.id]]);save()}
function pick(id,k,v){const p=prod(id),ops=p.ops||[];let best=null,bs=-1;sib(p).forEach(x=>{if((x.o||{})[k]!=v)return;const sc=ops.filter(n=>n!=k&&(x.o||{})[n]==(p.o||{})[n]).length;if(sc>bs){bs=sc;best=x}});if(best)location.hash='#/p/'+best.id}
const PRE={'📱 Телефон':'Память,Цвет','💻 Ноутбук':'Процессор,ОЗУ,Накопитель,Цвет','🎧 Наушники':'Цвет','✏ Свой набор':''};
function pform(id){const p=prod(id),g=p?(p.grp||p.id):0,sb=p?sib(p):[],b=p||{cat:D.cats[0]&&D.cats[0].id,name:'',brand:'',year:2025,country:'',warranty:12,desc:'',sp:{}};
PG={grp:g,ops:p?[...(p.ops||[])]:['Память','Цвет'],V:(sb.length?sb:[{o:{},price:0,disc:0,stock:true,imgs:[]}]).map(x=>({id:x.id,o:{...(x.o||{})},price:x.price||0,disc:x.disc||0,stock:x.stock!==false,imgs:[...(x.imgs||[])]}))};
modal(`<h3>${p?'Редактирование товара':'Новый товар'}</h3><input id="fn" placeholder="Название (например, iPhone 15)" value="${esc(b.name)}"><div class="row"><input id="fb" placeholder="Бренд" value="${esc(b.brand)}" style="flex:1"><select id="fc" style="flex:1">${D.cats.map(c=>`<option value="${c.id}" ${c.id==b.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
<div class="row"><input id="fy" type="number" placeholder="Год" value="${b.year}" style="flex:1"><input id="fw" type="number" placeholder="Гарантия, мес." value="${b.warranty}" style="flex:1"><input id="fo" placeholder="Страна" value="${esc(b.country)}" style="flex:1"></div>
<textarea id="fx" rows="3" placeholder="Описание">${esc(b.desc)}</textarea><textarea id="fs" rows="3" placeholder="Характеристики для фильтров: Ключ: значение (по строке)">${Object.entries(b.sp||{}).map(([k,v])=>k+': '+v).join('\n')}</textarea>
<h3 style="margin:6px 0 0">Параметры конфигурации</h3><small>Назовите параметры как нужно: «Память», «Процессор», «ОЗУ», «Цвет»… Переименование сохраняет введённые значения.</small><div class="row">${Object.keys(PRE).map(k=>`<button class="btn s" onclick="opp('${PRE[k]}')">${k}</button>`).join('')}</div><div id="opl"></div>
<h3 style="margin:6px 0 0">Конфигурации</h3><small>Каждая конфигурация — отдельный товар в каталоге со своей ценой, скидкой и фото.</small><div id="vr"></div><button class="btn" onclick="vadd()">＋ Конфигурация</button><button class="btn p" onclick="psave()">💾 Сохранить</button>`);$('#md').style.width='min(900px,100%)';opr();vr()}
function opr(){$('#opl').innerHTML=PG.ops.map((n,i)=>`<div class="row" style="margin-bottom:6px"><input value="${esc(n)}" onchange="opn(${i},this.value)" style="flex:1"><button class="btn s" onclick="opm(${i},-1)">↑</button><button class="btn s" onclick="opm(${i},1)">↓</button><button class="btn s" onclick="opd(${i})">🗑</button></div>`).join('')+`<button class="btn s" onclick="opa()">＋ Параметр</button>`}
function opn(i,v){v=v.trim();const old=PG.ops[i];if(!v||v==old||PG.ops.includes(v)){opr();return}PG.ops[i]=v;PG.V.forEach(x=>{if(old in x.o){x.o[v]=x.o[old];delete x.o[old]}});opr();vr()}
function opd(i){const n=PG.ops[i];PG.ops.splice(i,1);PG.V.forEach(x=>delete x.o[n]);opr();vr()}
function opm(i,d){const j=i+d;if(j<0||j>=PG.ops.length)return;[PG.ops[i],PG.ops[j]]=[PG.ops[j],PG.ops[i]];opr();vr()}
function opa(){let n='Параметр',k=1;while(PG.ops.includes(n))n='Параметр '+(++k);PG.ops.push(n);opr();vr()}
function opp(t){const nw=t?t.split(','):[];PG.V.forEach(x=>Object.keys(x.o).forEach(k=>{if(!nw.includes(k))delete x.o[k]}));PG.ops=nw;opr();vr()}
function vr(){$('#vr').innerHTML=PG.V.map((v,i)=>`<div class="brow"><div class="row"><b>№${i+1}</b>${PG.ops.map(n=>`<input placeholder="${esc(n)}" title="${esc(n)}" data-n="${esc(n)}" value="${esc(v.o[n]||'')}" oninput="PG.V[${i}].o[this.dataset.n]=this.value" style="flex:1;min-width:110px">`).join('')}<label style="white-space:nowrap"><input type="checkbox" style="width:auto" ${v.stock?'checked':''} onchange="PG.V[${i}].stock=this.checked"> В наличии</label>${PG.V.length>1?`<button class="btn s" onclick="PG.V.splice(${i},1);vr()">🗑</button>`:''}</div>
<div class="row"><label>Цена, ₽<input id="vp${i}" type="number" min="0" value="${rnd(v.price)}" oninput="vc(${i},'price',this.value)"></label><label>Скидка, %<input id="vd${i}" type="number" step="0.01" min="0" max="100" value="${rnd(v.disc)}" oninput="vc(${i},'disc',this.value)"></label><label>Скидка, ₽<input id="vo${i}" type="number" min="0" value="${rnd(v.price*v.disc/100)}" oninput="vc(${i},'off',this.value)"></label><label>Цена со скидкой, ₽<input id="vf${i}" type="number" min="0" value="${rnd(v.price*(1-v.disc/100))}" oninput="vc(${i},'fin',this.value)"></label></div>
<div class="th">${v.imgs.map((x,j)=>`<div><img src="${x}"><br><button class="btn s" onclick="PG.V[${i}].imgs.splice(${j},1);vr()">✕</button><label class="btn s" style="display:inline-block">↻<input type="file" accept="image/*" hidden onchange="vrep(${i},${j},this.files[0])"></label></div>`).join('')}<label class="btn s" style="align-self:center">＋ Фото<input type="file" accept="image/*" multiple hidden onchange="vimg(${i},this.files)"></label></div></div>`).join('')}
function vadd(){const l=PG.V[PG.V.length-1];PG.V.push({o:{...l.o},price:l.price,disc:l.disc,stock:true,imgs:[]});vr()}
function psave(){const n=$('#fn').value.trim();if(!n)return alert('Укажите название');if(PG.V.some(v=>!v.price)&&!confirm('У некоторых конфигураций цена 0. Продолжить?'))return;
const sp={};$('#fs').value.split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0)sp[l.slice(0,i).trim()]=l.slice(i+1).trim()});
const g=PG.grp||Date.now(),base={grp:g,name:n,ops:[...PG.ops],brand:$('#fb').value.trim(),cat:$('#fc').value,year:+$('#fy').value,warranty:+$('#fw').value,country:$('#fo').value,desc:$('#fx').value,sp},keep=PG.V.filter(v=>v.id).map(v=>v.id);
D.prods=D.prods.filter(x=>(x.grp||x.id)!=g||keep.includes(x.id));
PG.V.forEach((v,i)=>{const o={};PG.ops.forEach(k=>{const t=(v.o[k]||'').trim();if(t)o[k]=t});const f={o,price:v.price,disc:Math.min(100,v.disc),stock:v.stock,imgs:v.imgs};if(v.id){const x=prod(v.id);Object.assign(x,base,f);delete x.mem;delete x.color}else D.prods.push({id:Date.now()+i,date:Date.now(),...base,...f})});save();close_();admin()}
norm3();

/* ===== v5: оригинальное качество фото и просмотр во весь экран ===== */
let LB={id:0,i:0,x:0};
function lbOpen(id,i){const p=prod(id);if(!p||!(p.imgs||[]).length)return;LB={id,i:i||0,x:0};lbR();$('#lb').classList.add('o');document.body.style.overflow='hidden'}
function lbR(){const p=prod(LB.id),n=p.imgs.length;LB.i=(LB.i+n)%n;$('#lb').innerHTML=`<button class="btn x" onclick="lbC()">✕</button><img src="${p.imgs[LB.i]}" alt="">${n>1?`<button class="ar l" onclick="lbG(-1)">‹</button><button class="ar r" onclick="lbG(1)">›</button><div class="dots">${p.imgs.map((_,k)=>`<button class="dt ${k==LB.i?'on':''}" onclick="lbG(${k-LB.i})"></button>`).join('')}</div>`:''}`}
function lbG(d){LB.i+=d;lbR()}
function lbSw(e){const d=e.changedTouches[0].clientX-LB.x;const p=prod(LB.id);if(p&&p.imgs.length>1&&Math.abs(d)>40)lbG(d<0?1:-1)}
function lbC(){$('#lb').classList.remove('o');document.body.style.overflow='';const m=$('#mainim'),p=prod(LB.id);if(m&&p){IM=LB.i;m.innerHTML=img(p,IM)}}
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('o'))return;if(e.key=='Escape')lbC();if(e.key=='ArrowLeft')lbG(-1);if(e.key=='ArrowRight')lbG(1)});

addEventListener('hashchange',route);nav();route();
if(SB)boot();
</script></body></html>
